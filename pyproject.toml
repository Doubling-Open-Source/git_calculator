[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-calculator"
version = "2.0.0"
description = "Calculate DORA-style metrics from a Git repository on the local filesystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Doubling", email = "info@doubling.io" }]
dependencies = [
    "numpy>=2.3.1",
    "packaging==23.2",
    "Pillow",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "seaborn==0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.2",
    "pytest-image-snapshot",
    "pixelmatch",
    "iniconfig==2.0.0",
    "pluggy==1.3.0",
    "build",
]

[project.scripts]
git-calculator = "git_calculator.cli:main"

[project.urls]
Homepage = "https://github.com/Doubling-Open-Source/git_calculator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
