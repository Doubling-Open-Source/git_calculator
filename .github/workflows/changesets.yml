name: Changesets

on:
  pull_request:

jobs:
  changeset:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Require changeset when product files change
        run: scripts/check-changeset.sh "origin/${{ github.base_ref }}"
